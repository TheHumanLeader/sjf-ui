<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#273160" flood-opacity=".08"/>
    </filter>
    <style>
      text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1b1b21}
      .muted{fill:#686973}.primary{fill:#4f64d9}.error{fill:#ba1a1a}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.title{font-size:28px;font-weight:750}.h2{font-size:18px;font-weight:700}.bold{font-weight:700}
      .card{fill:#fff;stroke:#d8d8e2}.soft{fill:#f5f5fb}.line{stroke:#c7c6d0;fill:none}.focus{stroke:#4f64d9;fill:#fff}.danger{stroke:#ba1a1a;fill:#fff}.labelbg{fill:#eceef6}.chip{fill:#dce1ff}.chipText{fill:#253b99;font-weight:700}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#fafaff"/>
  <text x="42" y="58" class="title">SJF-UI · Label</text>
  <text x="42" y="84" class="small muted">Material 3 基础 · 办公化 · Ordered Size System · Vue 3 Vapor Mode</text>

  <g transform="translate(42 120)">
    <rect width="310" height="710" rx="18" class="card" filter="url(#shadow)"/>
    <text x="24" y="38" class="h2">设计规则</text>
    <text x="24" y="75" class="small bold">Modes</text>
    <g transform="translate(24 92)">
      <rect width="58" height="28" rx="8" class="chip"/><text x="16" y="19" class="tiny chipText">m3</text>
      <rect y="38" width="112" height="28" rx="8" class="soft"/><text x="12" y="57" class="tiny">horizontal</text>
      <rect y="76" width="144" height="28" rx="8" class="soft"/><text x="12" y="95" class="tiny">horizontal-box</text>
      <rect y="114" width="92" height="28" rx="8" class="soft"/><text x="12" y="133" class="tiny">vertical</text>
      <rect y="152" width="126" height="28" rx="8" class="soft"/><text x="12" y="171" class="tiny">vertical-box</text>
    </g>

    <text x="24" y="312" class="small bold">Ordered Size</text>
    <text x="24" y="340" class="small muted">mn &lt; sm &lt; nm &lt; md &lt; lg</text>
    <text x="24" y="368" class="tiny primary">nm = 默认中心</text>
    <g transform="translate(24 390)">
      <text y="0" class="tiny muted">组件只保存相对 recipe：</text>
      <text y="28" class="tiny">controlHeight</text><text x="230" y="28" class="tiny primary">0</text>
      <text y="52" class="tiny">gap</text><text x="230" y="52" class="tiny primary">-1</text>
      <text y="76" class="tiny">radius</text><text x="230" y="76" class="tiny primary">-1</text>
      <text y="100" class="tiny">floating font</text><text x="230" y="100" class="tiny primary">-1</text>
      <text y="124" class="tiny">focus line</text><text x="230" y="124" class="tiny primary">+1</text>
    </g>

    <text x="24" y="558" class="small bold">Material Color Roles</text>
    <circle cx="31" cy="589" r="6" fill="#4f64d9"/><text x="48" y="594" class="tiny">primary · focus</text>
    <circle cx="31" cy="618" r="6" fill="#45464f"/><text x="48" y="623" class="tiny">on-surface-variant · label</text>
    <circle cx="31" cy="647" r="6" fill="#c7c6d0"/><text x="48" y="652" class="tiny">outline-variant · border</text>
    <circle cx="31" cy="676" r="6" fill="#ba1a1a"/><text x="48" y="681" class="tiny">error</text>
  </g>

  <g transform="translate(380 120)">
    <text x="0" y="22" class="h2">五种模式 · size = nm</text>

    <g transform="translate(0 48)">
      <rect width="190" height="270" rx="16" class="card" filter="url(#shadow)"/>
      <text x="18" y="30" class="small bold primary">m3</text>
      <text x="18" y="58" class="tiny muted">默认</text>
      <rect x="18" y="70" width="154" height="48" rx="8" class="line"/><text x="31" y="99" class="small muted">用户名</text>
      <text x="18" y="145" class="tiny muted">Focused / Filled</text>
      <rect x="18" y="158" width="154" height="52" rx="8" class="focus" stroke-width="2"/><rect x="28" y="151" width="50" height="16" fill="#fff"/><text x="32" y="163" class="tiny primary">用户名</text><text x="31" y="190" class="small">张三</text>
      <text x="18" y="235" class="tiny muted">Label 在内容区内浮动</text>
    </g>

    <g transform="translate(208 48)">
      <rect width="190" height="270" rx="16" class="card" filter="url(#shadow)"/>
      <text x="18" y="30" class="small bold primary">horizontal</text>
      <text x="18" y="58" class="tiny muted">左标签 / 右内容</text>
      <text x="18" y="102" class="small">用户名</text><rect x="78" y="78" width="94" height="44" rx="7" class="line"/><text x="92" y="105" class="small muted">张三</text>
      <text x="18" y="164" class="tiny muted">办公后台默认备选</text>
      <line x1="18" y1="188" x2="172" y2="188" stroke="#ececf4"/>
      <text x="18" y="218" class="tiny muted">labelWidth = size(0)</text>
      <text x="18" y="242" class="tiny muted">gap = size(-1)</text>
    </g>

    <g transform="translate(416 48)">
      <rect width="190" height="270" rx="16" class="card" filter="url(#shadow)"/>
      <text x="18" y="30" class="small bold primary">horizontal-box</text>
      <text x="18" y="58" class="tiny muted">共享一个外边界</text>
      <rect x="18" y="78" width="154" height="48" rx="7" class="line"/><rect x="18" y="78" width="58" height="48" rx="7" class="labelbg"/><line x1="76" y1="78" x2="76" y2="126" stroke="#c7c6d0"/><text x="28" y="107" class="tiny">用户名</text><text x="91" y="107" class="small">张三</text>
      <text x="18" y="163" class="tiny primary">--sjf-control-embedded: 1</text>
      <text x="18" y="192" class="tiny muted">禁止双层 input border</text>
    </g>

    <g transform="translate(624 48)">
      <rect width="190" height="270" rx="16" class="card" filter="url(#shadow)"/>
      <text x="18" y="30" class="small bold primary">vertical</text>
      <text x="18" y="58" class="tiny muted">上标签 / 下内容</text>
      <text x="18" y="94" class="tiny">用户名</text><rect x="18" y="106" width="154" height="44" rx="7" class="line"/><text x="31" y="133" class="small">张三</text>
      <text x="18" y="184" class="tiny muted">适合窄列 / 移动端</text>
    </g>

    <g transform="translate(832 48)">
      <rect width="190" height="270" rx="16" class="card" filter="url(#shadow)"/>
      <text x="18" y="30" class="small bold primary">vertical-box</text>
      <text x="18" y="58" class="tiny muted">上下盒式结构</text>
      <rect x="18" y="78" width="154" height="82" rx="7" class="line"/><rect x="18" y="78" width="154" height="34" rx="7" class="labelbg"/><line x1="18" y1="112" x2="172" y2="112" stroke="#c7c6d0"/><text x="30" y="100" class="tiny">用户名</text><text x="30" y="141" class="small">张三</text>
      <text x="18" y="194" class="tiny muted">适合结构化信息录入</text>
    </g>

    <g transform="translate(0 346)">
      <rect width="1022" height="150" rx="16" class="card"/>
      <text x="18" y="30" class="small bold">Size 迁移</text>
      <text x="18" y="54" class="tiny muted">同一个 horizontal recipe，只改变基准 size；内部关系保持。</text>
      <g transform="translate(20 76)">
        <text x="0" y="22" class="tiny muted">mn</text><rect x="30" y="4" width="120" height="34" rx="4" class="line"/><text x="44" y="26" class="tiny">张三</text>
        <text x="182" y="22" class="tiny muted">sm</text><rect x="212" y="1" width="132" height="38" rx="6" class="line"/><text x="226" y="26" class="tiny">张三</text>
        <text x="378" y="22" class="tiny primary">nm</text><rect x="408" y="-3" width="146" height="44" rx="8" class="focus"/><text x="424" y="25" class="small">张三</text>
        <text x="590" y="22" class="tiny muted">md</text><rect x="622" y="-7" width="160" height="50" rx="10" class="line"/><text x="638" y="25" class="small">张三</text>
        <text x="818" y="22" class="tiny muted">lg</text><rect x="848" y="-11" width="154" height="58" rx="14" class="line"/><text x="866" y="25" class="body">张三</text>
      </g>
    </g>

    <g transform="translate(0 520)">
      <rect width="1022" height="190" rx="16" class="card"/>
      <text x="18" y="32" class="small bold">States & API</text>
      <g transform="translate(18 54)">
        <rect width="210" height="48" rx="8" class="focus" stroke-width="2"/><rect x="12" y="-7" width="44" height="14" fill="#fff"/><text x="16" y="3" class="tiny primary">姓名</text><text x="14" y="30" class="small">张三</text>
        <rect x="238" width="210" height="48" rx="8" class="danger"/><rect x="250" y="-7" width="44" height="14" fill="#fff"/><text x="254" y="3" class="tiny error">姓名</text><text x="252" y="30" class="small">张三</text>
        <text x="238" y="68" class="tiny error">错误状态</text>
      </g>
      <text x="18" y="148" class="tiny muted">Props: label · mode · size · required · disabled · error · focused · filled · helper</text>
      <text x="18" y="172" class="tiny primary">Input / Select / Textarea / DatePicker 默认内置 Label(mode = m3)</text>
    </g>
  </g>
</svg>
